<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imobil</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/marca.svg" />
    <meta name="description" content="Gestão de imóveis, contratos e recebimentos para proprietários e imobiliárias." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Este index.html é a FONTE que o servidor do Vite monta. Aberto direto do disco (dois cliques),
      // ele fica em branco. Aqui ele avisa qual arquivo abrir. No Imobil.html gerado o script do app
      // vem embutido (sem src="/src/main.tsx"), então este aviso nunca aparece lá.
      if (location.protocol === 'file:' && document.querySelector('script[src="/src/main.tsx"]')) {
        document.getElementById('root').innerHTML =
          '<div style="font:15px/1.6 system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 24px;color:#1f2937">' +
          '<h1 style="font-size:22px;font-weight:600;margin:0 0 8px">Este é o arquivo-fonte do Imobil</h1>' +
          '<p style="margin:0 0 8px">Para abrir com dois cliques, use o <b>Imobil.html</b> desta mesma pasta.</p>' +
          '<p style="margin:0;color:#6b7280">Se ele ainda não existe, gere com <code>npm run arquivo</code>. Para editar o código, use <code>npm run dev</code> e abra http://localhost:5173.</p></div>'
      }
    </script>
  </body>
</html>
